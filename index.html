<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Creator website</title>
    <script>
      // Applied synchronously, before Vue mounts, so there is no
      // light-mode flash for users who have picked dark mode.
      (function () {
        try {
          var stored = localStorage.getItem('pca-theme');
          var wantsDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (wantsDark) document.documentElement.classList.add('app-dark');
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) - default to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
